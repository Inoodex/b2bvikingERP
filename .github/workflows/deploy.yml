name: Deploy to Production

# -----------------------------------------------------------------------------
# Trigger: runs on every push to main branch or manual dispatch
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Concurrency: prevent overlapping deployments
# -----------------------------------------------------------------------------
concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Release Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20 with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Build Frontend Assets (Vite -> public/build)
      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      # Step 4: Upload Changed Files via Standard GitHub Marketplace FTP Action
      #         CRITICAL: vendor/, node_modules/, .env, storage/, and static
      #         modules/ (4,500 files already on server) are strictly EXCLUDED!
      - name: Upload Changed Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            **/tests/**
            **/docs/**
            **/storage/**
            public/backend/assets/modules/**
            erp_database_v4/**
            plan/**
            README.md
            phpunit.xml
            *.zip
            *.bak

      # Step 5: Trigger Post-Deploy Webhook (Runs migrations, clears & rebuilds caches)
      - name: Run Server Post-Deploy Automation
        run: |
          echo "Triggering deployment webhook..."
          WEBHOOK_URL="${{ secrets.DEPLOY_WEBHOOK_URL }}"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "$WEBHOOK_URL")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          # If root endpoint returned error, attempt public/deploy.php
          if [ "$HTTP_STATUS" -ne 200 ] && [[ "$WEBHOOK_URL" != *"public/deploy.php"* ]]; then
            ALT_URL="https://test.b2bviking.com/public/deploy.php"
            echo "Attempting alternative endpoint: $ALT_URL"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
              "$ALT_URL")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
          fi
          
          echo "Server Response (HTTP $HTTP_STATUS):"
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment webhook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

      # Step 6: Production Health Check
      - name: Production Health Check
        run: |
          echo "Checking production site response..."
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://test.b2bviking.com")
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Site is live and responding!"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Health check returned status: $STATUS"
