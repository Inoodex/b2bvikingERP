name: Deploy to Production

# -----------------------------------------------------------------------------
# Trigger: runs on push to main or via manual dispatch
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_vendor:
        description: 'Force re-bundle and upload vendor archive?'
        type: boolean
        default: false

# -----------------------------------------------------------------------------
# Concurrency: prevent overlapping deployments
# -----------------------------------------------------------------------------
concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Release Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Step 2: Setup PHP 8.3 & Composer tools
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, gd, zip
          tools: composer:v2

      # Step 3: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 4: Detect whether composer.lock changed
      - name: Detect Composer Changes
        id: composer_diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_vendor }}" = "true" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            echo "Vendor sync forced by manual workflow dispatch."
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qE "composer\.(json|lock)"; then
              echo "CHANGED=true" >> $GITHUB_OUTPUT
              echo "Composer changes detected in this commit."
            else
              echo "CHANGED=false" >> $GITHUB_OUTPUT
              echo "No composer changes detected."
            fi
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      # Step 5: Install PHP Dependencies (Build only, not uploaded directly)
      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # Step 6: Build Frontend Assets (Vite -> public/build)
      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      # Step 7: Prepare High-Speed Single Archive Artifact (Instant FTP Upload)
      - name: Package Release Artifact
        run: |
          echo "Packaging application into release.zip..."
          mkdir -p build_artifact/public
          
          # Compress application files excluding vendor, storage, git, and dev files
          zip -rq build_artifact/release.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "vendor/*" "storage/*" \
               "tests/*" "docs/*" ".env*" "README.md" "phpunit.xml" "build_artifact/*"
          
          # Copy deploy webhook to both root and public/ for fail-safe HTTP routing
          cp public/deploy.php build_artifact/public/deploy.php
          cp public/deploy.php build_artifact/deploy.php
          
          # If composer packages changed, bundle vendor archive
          if [ "${{ steps.composer_diff.outputs.CHANGED }}" = "true" ]; then
            echo "Packaging vendor.zip archive..."
            zip -rq build_artifact/vendor.zip vendor/
          fi
          
          echo "Artifact directory ready for rapid transfer:"
          ls -lh build_artifact/

      # Step 8: Upload Release via FTP (Transfers ONLY release.zip and deploy.php in seconds)
      - name: Upload Release Artifact via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./build_artifact/

      # Step 9: Call deploy.php to extract release.zip, run migrations & optimize
      - name: Run Server Post-Deploy Automation
        run: |
          echo "Calling deployment webhook on server..."
          WEBHOOK_URL="${{ secrets.DEPLOY_WEBHOOK_URL }}"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "$WEBHOOK_URL")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          # If root endpoint returned error, attempt public/deploy.php
          if [ "$HTTP_STATUS" -ne 200 ] && [[ "$WEBHOOK_URL" != *"public/deploy.php"* ]]; then
            ALT_URL="https://test.b2bviking.com/public/deploy.php"
            echo "Attempting alternative endpoint: $ALT_URL"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
              "$ALT_URL")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
          fi
          
          echo "Server Response (HTTP $HTTP_STATUS):"
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment webhook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

      # Step 10: Production Health Check
      - name: Production Health Check
        run: |
          echo "Validating production site health..."
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://test.b2bviking.com")
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Production is healthy and responding with HTTP $STATUS!"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Health check returned status: $STATUS"
