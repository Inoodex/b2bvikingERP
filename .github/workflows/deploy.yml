name: Deploy to Production

# -----------------------------------------------------------------------------
# Trigger: runs on every push to main branch or via manual dispatch
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_vendor:
        description: 'Force re-bundle and upload vendor.zip archive?'
        type: boolean
        default: false

# -----------------------------------------------------------------------------
# Concurrency: prevent simultaneous overlapping deployments
# -----------------------------------------------------------------------------
concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Release Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout Repository (fetch last 2 commits to inspect diffs)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Step 2: Setup PHP 8.3 with extensions and Composer caching
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, gd, zip
          tools: composer:v2

      # Step 3: Setup Node.js 20 with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 4: Detect whether composer.lock was modified
      - name: Detect Composer Changes
        id: composer_diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_vendor }}" = "true" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            echo "Vendor sync forced by manual workflow trigger."
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q "composer.lock"; then
              echo "CHANGED=true" >> $GITHUB_OUTPUT
              echo "composer.lock changes detected in this commit."
            else
              echo "CHANGED=false" >> $GITHUB_OUTPUT
              echo "No composer changes detected. Skipping vendor bundle."
            fi
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      # Step 5: Install PHP Dependencies in CI
      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # Step 6: Create vendor.zip archive ONLY when packages changed
      - name: Bundle Vendor Archive (Conditional)
        if: steps.composer_diff.outputs.CHANGED == 'true'
        run: |
          echo "Packaging vendor/ into vendor.zip archive..."
          zip -rq vendor.zip vendor/
          echo "vendor.zip created successfully:"
          ls -lh vendor.zip

      # Step 7: Compile Vite / Tailwind Frontend Assets
      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      # Step 8: Upload to Namecheap via Secure FTP
      #         CRITICAL: vendor/, node_modules/, .env, and storage/ are strictly EXCLUDED!
      #         Only the modified application files (and vendor.zip if created) are transferred.
      - name: Upload to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            **/tests/**
            **/docs/**
            **/storage/**
            README.md
            phpunit.xml

      # Step 9: Call deploy.php to extract vendor.zip, run migrations & optimize
      - name: Run Server Post-Deploy Automation
        run: |
          echo "Calling deployment webhook on server..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Server Response (HTTP $HTTP_STATUS):"
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment webhook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

      # Step 10: Production Health Check
      - name: Production Health Check
        run: |
          echo "Validating production site health..."
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://test.b2bviking.com")
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Production is healthy and responding with HTTP $STATUS!"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Health check returned non-200 status: $STATUS"
